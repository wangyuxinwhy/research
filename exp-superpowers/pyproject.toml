[build-system]
requires = ["maturin>=1.0"]
build-backend = "maturin"

[project]
name = "evident"
requires-python = ">=3.14"
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
]
dynamic = ["version"]

[dependency-groups]
dev = ["pytest>=9.0", "basedpyright>=1.29", "ruff>=0.11"]

[tool.maturin]
manifest-path = "crates/evident-py/Cargo.toml"
features = ["pyo3/extension-module"]
module-name = "evident._core"

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = ["ALL"]
ignore = ["D1", "D203", "D213", "COM812", "ISC001"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "S101",    # assert is fine in tests
    "ANN201",  # return type annotation not needed for tests
    "PLR2004", # magic values are fine in tests
    "ERA001",  # commented code is fine in tests for context
]

[tool.basedpyright]
pythonVersion = "3.14"
typeCheckingMode = "all"
reportUnknownMemberType = false
reportUnknownVariableType = false
reportUnknownArgumentType = false
reportAttributeAccessIssue = false

[tool.pytest.ini_options]
testpaths = ["tests"]
