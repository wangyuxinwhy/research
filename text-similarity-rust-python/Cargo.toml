[package]
name = "text-similarity-rust"
version = "0.1.0"
edition = "2021"

[lib]
name = "text_similarity_rust"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.20", features = ["extension-module"] }
ndarray = "0.15"
rayon = "1.8"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
